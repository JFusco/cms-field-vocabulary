name: Vendor documentation freshness

on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "47 13 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan depth
        required: true
        default: full
        type: choice
        options:
          - index
          - full

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-documentation-freshness
  cancel-in-progress: false

jobs:
  scan:
    name: scan official vendor documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan official sources without mutating reviewed records
        id: scans
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/vendor-doc-freshness"
          mkdir -p "$artifact_dir"

          set +e
          node scripts/source-scan.mjs --mode index --output "$artifact_dir/index.json" >"$artifact_dir/index.log" 2>&1
          index_status=$?
          full_status=0
          run_full=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
            run_full=true
          fi
          if [ "${{ github.event.schedule }}" = "47 13 * * 1" ]; then
            run_full=true
          fi
          if [ "$run_full" = true ]; then
            node scripts/source-scan.mjs --mode full --output "$artifact_dir/full.json" >"$artifact_dir/full.log" 2>&1
            full_status=$?
          else
            printf '%s\n' 'Full scan not selected for this run.' >"$artifact_dir/full.log"
          fi
          set -e

          git status --porcelain=v1 --untracked-files=all >"$artifact_dir/worktree-status.txt"
          worktree_mutated=false
          if [ -s "$artifact_dir/worktree-status.txt" ]; then
            worktree_mutated=true
          fi

          summary_args=(--index "$artifact_dir/index.json" --output "$artifact_dir/summary.md" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ "$run_full" = true ]; then summary_args+=(--full "$artifact_dir/full.json"); fi
          set +e
          node scripts/source-scan-summary.mjs "${summary_args[@]}" >"$artifact_dir/summary.log" 2>&1
          summary_status=$?
          set -e
          if [ "$summary_status" -ne 0 ]; then
            printf '# Vendor documentation freshness\n\nScan summary failed; inspect the uploaded logs.\n' >"$artifact_dir/summary.md"
          fi

          outcome=current
          if [ "$index_status" -ne 0 ] || [ "$full_status" -ne 0 ] || [ "$summary_status" -ne 0 ] || [ "$worktree_mutated" = true ]; then
            outcome=attention
          fi

          {
            cat "$artifact_dir/summary.md"
            echo "- Index scan exit status: $index_status"
            echo "- Full scan exit status: $full_status"
            echo "- Full scan selected: $run_full"
            echo "- Scanner changed the checkout: $worktree_mutated"
            echo "- Outcome: $outcome"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "index_status=$index_status"
            echo "full_status=$full_status"
            echo "summary_status=$summary_status"
            echo "run_full=$run_full"
            echo "worktree_mutated=$worktree_mutated"
            echo "outcome=$outcome"
          } >> "$GITHUB_OUTPUT"

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-doc-freshness-${{ github.run_id }}
          path: ${{ runner.temp }}/vendor-doc-freshness
          if-no-files-found: error
          retention-days: 30

      - name: Open or update scanner failure issue
        if: always() && steps.scans.outputs.outcome == 'attention'
        uses: actions/github-script@v9
        env:
          INDEX_STATUS: ${{ steps.scans.outputs.index_status }}
          FULL_STATUS: ${{ steps.scans.outputs.full_status }}
          SUMMARY_STATUS: ${{ steps.scans.outputs.summary_status }}
          WORKTREE_MUTATED: ${{ steps.scans.outputs.worktree_mutated }}
          ARTIFACT_DIR: ${{ runner.temp }}/vendor-doc-freshness
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statuses = [process.env.INDEX_STATUS, process.env.FULL_STATUS];
            const failed = statuses.some((status) => !["0", "2"].includes(status)) || process.env.SUMMARY_STATUS !== "0";
            const mutated = process.env.WORKTREE_MUTATED === "true";
            if (!failed && !mutated) return;
            const title = mutated ? "Vendor documentation scanner changed the checkout" : "Vendor documentation scanner failed";
            const summary = path.join(process.env.ARTIFACT_DIR, "summary.md");
            const body = [
              `The source scanner needs maintenance: ${mutated ? "the checkout changed" : "a scan or summary failed"}.`,
              "",
              `- Index status: \`${process.env.INDEX_STATUS}\``,
              `- Full status: \`${process.env.FULL_STATUS}\``,
              `- Summary status: \`${process.env.SUMMARY_STATUS}\``,
              `- Evidence and logs: ${runUrl}`,
              "",
              fs.existsSync(summary) ? fs.readFileSync(summary, "utf8").slice(0, 4000) : "Summary unavailable.",
            ].join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
