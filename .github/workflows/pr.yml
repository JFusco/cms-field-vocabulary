name: Create or update PR

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: Existing branch to open as a pull request
        required: true
      base_branch:
        description: Target base branch
        required: true
        default: main
      draft:
        description: Create PR as draft
        required: true
        default: "true"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ inputs.head_branch }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr:
    name: pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch automation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_BRANCH: ${{ inputs.base_branch }}
          PR_HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_DRAFT: ${{ inputs.draft }}
        run: pnpm run pr:create
