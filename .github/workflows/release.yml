name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: cms-field-vocabulary-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.1.1 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject aggregated breaking-change bodies
        run: pnpm run release:preflight

      - name: Verify source, projections, and tests
        run: pnpm run verify:ci

      - name: Pack and clean-install tarball
        run: node scripts/verify-packed-consumer.mjs

      - name: Inspect packed artifact
        run: npm pack --dry-run --ignore-scripts

      - name: Record pre-release revision
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish, tag, changelog, and GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

      - name: Detect a published release
        id: released
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          # @semantic-release/git commits the release, so HEAD moves only when a version was published.
          if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then echo 'published=true' >> "$GITHUB_OUTPUT"; fi

      - name: Wait for the release on the npm registry
        if: steps.released.outputs.published == 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          # npm accepts the upload minutes before the registry serves it; Renovate reads the packument.
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${name.replace('/', '%2F')}`;
          for (let attempt = 1; attempt <= 40; attempt++) {
            try {
              const response = await fetch(url);
              if (response.ok && (await response.json()).versions?.[version]) {
                console.log(`${name}@${version} is on the registry after ${attempt} check(s).`);
                process.exit(0);
              }
            } catch (error) {
              console.log(`Registry check ${attempt} failed: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          console.log(`::warning::${name}@${version} is not on the registry after 10 minutes; dispatching anyway.`);
          EOF

      - name: Mint Pin Courier token
        id: courier
        if: steps.released.outputs.published == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: JFusco
          repositories: renovate-config
          permission-contents: write

      - name: Notify the Renovate runner
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.courier.outputs.token }}
        run: gh api --method POST repos/JFusco/renovate-config/dispatches -f event_type=package-released
